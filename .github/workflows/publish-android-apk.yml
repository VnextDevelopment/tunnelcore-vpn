name: Build signed universal Android APK

# The standard path builds the latest main commit and uploads a signed APK
# to the workflow's Actions Artifacts. No GitHub Release or Google Play
# publication is required. Optional publication uses an existing release tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional exact version (e.g. 5.0.2.173); blank = automatic 5.0.2.<run number>"
        required: false
        type: string
      publish_release:
        description: "Also attach APK to an EXISTING published GitHub Release (requires version)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-sideload-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/
  QT_VERSION: 6.10.1
  NDK_VERSION: 27.0.11718014
  ANDROID_PLATFORM: android-28
  QT_DESKTOP_MODULES: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
  QT_ANDROID_MODULES: 'qtremoteobjects qt5compat qtshadertools'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROD_AGW_PUBLIC_KEY: ${{ secrets.PROD_AGW_PUBLIC_KEY }}
      PROD_S3_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
      FALLBACK_S3_ENDPOINT: ${{ secrets.FALLBACK_S3_ENDPOINT }}
      DEV_AGW_PUBLIC_KEY: ${{ secrets.DEV_AGW_PUBLIC_KEY }}
      DEV_AGW_ENDPOINT: ${{ secrets.DEV_AGW_ENDPOINT }}
      DEV_S3_ENDPOINT: ${{ secrets.DEV_S3_ENDPOINT }}
      FREE_V2_ENDPOINT: ${{ secrets.FREE_V2_ENDPOINT }}
      PREM_V1_ENDPOINT: ${{ secrets.PREM_V1_ENDPOINT }}
      QT_ANDROID_KEYSTORE_PATH: /tmp/tunnelcore-release.keystore
      QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
    steps:
      - name: Select version and build source
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          # By default CMake uses 5.0.2.${GITHUB_RUN_NUMBER}. The optional
          # version is forwarded to CMake and its fourth field to Android
          # versionCode generation, so the artifact and APK version agree.
          if [[ -n "$REQUESTED_VERSION" ]]; then
            if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[1-9][0-9]{0,7}$ ]]; then
              echo "::error::Version must be four numeric components, e.g. 5.0.2.173 (last 1..99999999)"
              exit 1
            fi
            build_number="${REQUESTED_VERSION##*.}"
            echo "AMNEZIAVPN_VERSION=$REQUESTED_VERSION" >> "$GITHUB_ENV"
          else
            if [[ "$PUBLISH_RELEASE" == "true" ]]; then
              echo "::error::Provide the exact published GitHub Release version when publish_release is enabled"
              exit 1
            fi
            build_number="$GITHUB_RUN_NUMBER"
          fi
          echo "ANDROID_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

      - name: Checkout main (or matching release tag for optional publication)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.publish_release && format('v{0}', inputs.version) || 'main' }}
          submodules: 'true'
          fetch-depth: 10

      - name: Verify optional published GitHub Release
        if: ${{ inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # In release mode the checkout is pinned to the exact tag, so a
          # newer main commit cannot accidentally be attached to an old release.
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease \
            --jq '(.isDraft == false) and (.isPrerelease == false)' | grep -qx true

      - name: Install desktop Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_DESKTOP_MODULES }}
          dir: ${{ runner.temp }}
          py7zrversion: '==0.22.*'
          extra: '--base ${{ env.QT_MIRROR }}'

      # Original SberBox can run a 32-bit Android userspace, even on a 64-bit CPU.
      # A so-called universal APK without armeabi-v7a is not compatible with it.
      - name: Install Android Qt armeabi-v7a
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_armv7
          modules: ${{ env.QT_ANDROID_MODULES }}
          dir: ${{ runner.temp }}
          py7zrversion: '==0.22.*'
          extra: '--base ${{ env.QT_MIRROR }}'

      - name: Install Android Qt arm64-v8a
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: ${{ env.QT_ANDROID_MODULES }}
          dir: ${{ runner.temp }}
          py7zrversion: '==0.22.*'
          extra: '--base ${{ env.QT_MIRROR }}'

      - name: Install Android Qt x86
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_x86
          modules: ${{ env.QT_ANDROID_MODULES }}
          dir: ${{ runner.temp }}
          py7zrversion: '==0.22.*'
          extra: '--base ${{ env.QT_MIRROR }}'

      - name: Install Android Qt x86_64
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_x86_64
          modules: ${{ env.QT_ANDROID_MODULES }}
          dir: ${{ runner.temp }}
          py7zrversion: '==0.22.*'
          extra: '--base ${{ env.QT_MIRROR }}'

      - name: Set up Java and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;${{ env.ANDROID_PLATFORM }} platforms;android-36 build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Conan
        run: pip install "conan==2.28.0"

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$QT_ANDROID_KEYSTORE_STORE_PASS"
          test -n "$QT_ANDROID_KEYSTORE_ALIAS"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$QT_ANDROID_KEYSTORE_PATH"
          chmod 600 "$QT_ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$QT_ANDROID_KEYSTORE_PATH" \
            -storepass "$QT_ANDROID_KEYSTORE_STORE_PASS" \
            -alias "$QT_ANDROID_KEYSTORE_ALIAS" >/dev/null

      - name: Build signed OSS APK
        shell: bash
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # Build all four native ABIs into ONE APK; the Play AAB is separate.
          # The fourth version component also controls Android versionCode.
          GITHUB_RUN_NUMBER="$ANDROID_BUILD_NUMBER" deploy/build.sh -t android \
            --abi arm64-v8a --abi armeabi-v7a --abi x86 --abi x86_64 \
            --build ./deploy/build/android-oss-release --sign
          VERSION=$(grep '^CMAKE_PROJECT_VERSION:STATIC=' deploy/build/android-oss-release/CMakeCache.txt | cut -d= -f2)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Could not determine the CMake Android application version"
            exit 1
          }
          if [[ -n "${AMNEZIAVPN_VERSION:-}" && "$VERSION" != "$AMNEZIAVPN_VERSION" ]]; then
            echo "::error::Built version $VERSION does not match requested $AMNEZIAVPN_VERSION"
            exit 1
          fi
          echo "ANDROID_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p deploy/artifacts
          mapfile -t apks < <(find deploy/build/android-oss-release/client/android-build/build/outputs/apk \
            -type f -name '*release-signed.apk')
          [[ "${#apks[@]}" == 1 ]] || {
            echo "::error::Expected a single signed OSS Android APK"
            exit 1
          }
          # Do not publish another arm64-only package with a misleading
          # "universal" filename. All supported native ABIs must be embedded.
          unzip -Z1 "${apks[0]}" > /tmp/tunnelcore-apk-entries.txt
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            if ! grep -q "^lib/${abi}/" /tmp/tunnelcore-apk-entries.txt; then
              echo "::error::Missing native libraries for ${abi} in the universal APK"
              exit 1
            fi
          done
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "${apks[0]}"
          apk="deploy/artifacts/TunnelCoreVPN_${VERSION}_android_universal.apk"
          cp "${apks[0]}" "$apk"
          (cd deploy/artifacts && sha256sum "TunnelCoreVPN_${VERSION}_android_universal.apk" \
            > "TunnelCoreVPN_${VERSION}_android_universal.sha256")

      - name: Upload signed Universal APK to Actions Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TunnelCoreVPN-Android-Universal-Signed
          path: |
            deploy/artifacts/TunnelCoreVPN_*_android_universal.apk
            deploy/artifacts/TunnelCoreVPN_*_android_universal.sha256
          if-no-files-found: error
          archive: false
          retention-days: 30

      - name: Optionally attach APK to matching GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Never create a release implicitly. Desktop releases are approved
          # separately by publish-release.yml; this only attaches Android.
          gh release upload "v${ANDROID_RELEASE_VERSION}" \
            "deploy/artifacts/TunnelCoreVPN_${ANDROID_RELEASE_VERSION}_android_universal.apk" \
            "deploy/artifacts/TunnelCoreVPN_${ANDROID_RELEASE_VERSION}_android_universal.sha256" \
            --repo "$GITHUB_REPOSITORY"
