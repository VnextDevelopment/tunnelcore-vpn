name: 'Android + Windows CI'

on:
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: android-windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/

jobs:
  Branding-Safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify platform branding and installer safety
        shell: bash
        run: |
          python3 -m unittest discover -s tests/branding -p 'test_*.py'
          bash -n deploy/data/macos/post_install.sh deploy/data/macos/post_uninstall.sh
          bash -n deploy/data/linux/post_install.sh deploy/data/linux/post_uninstall.sh
          bash -n client/client_scripts/mac_installer.sh

  QML-Auth-Navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libgl1 libxkbcommon0
      - run: pip install PySide6==6.10.1
      - name: Exercise auth layout and remote navigation
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -m unittest discover -s tests/qml -v

  Test-Windows:
    runs-on: windows-latest

    env:
      QT_VERSION: 6.10.1
      PROD_AGW_PUBLIC_KEY: ${{ secrets.PROD_AGW_PUBLIC_KEY }}
      PROD_S3_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
      FALLBACK_S3_ENDPOINT: ${{ secrets.FALLBACK_S3_ENDPOINT }}
      DEV_AGW_PUBLIC_KEY: ${{ secrets.DEV_AGW_PUBLIC_KEY }}
      DEV_AGW_ENDPOINT: ${{ secrets.DEV_AGW_ENDPOINT }}
      DEV_S3_ENDPOINT: ${{ secrets.DEV_S3_ENDPOINT }}
      FREE_V2_ENDPOINT: ${{ secrets.FREE_V2_ENDPOINT }}
      PREM_V1_ENDPOINT: ${{ secrets.PREM_V1_ENDPOINT }}

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Install Qt'
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtremoteobjects qt5compat qtshadertools'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        tools: 'tools_ifw'
        set-env: 'true'
        aqtversion: '==3.3.0'
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup MSVC'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: 'x64'

    - name: 'Setup .NET SDK'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: 'Install WiX Toolset'
      shell: powershell
      run: |
        dotnet tool install --global wix --version 4.0.6
        wix extension add -g WixToolset.UI.wixext/4.0.6
        wix extension add -g WixToolset.Util.wixext/4.0.6
        wix extension list -g
        $wixBinDir = Join-Path $env:USERPROFILE ".dotnet\tools"
        echo "WIX_BIN_DIR=$wixBinDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: 'Setup Python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install Conan'
      run: pip install "conan==2.28.0"

    - name: 'Build project'
      shell: cmd
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
      run: |
        set WIX_ROOT_PATH="${{ env.USERPROFILE }}\.dotnet\tools"
        deploy\build.bat --installer all

    - name: 'Upload WIX installer artifact'
      uses: actions/upload-artifact@v7
      with:
        name: TunnelCoreVPN-Windows-MSI
        path: deploy/build/TunnelCoreVPN_*_windows_x64.msi
        archive: false
        retention-days: 7

    - name: 'Upload IFW installer artifact'
      uses: actions/upload-artifact@v7
      with:
        name: TunnelCoreVPN-Windows-EXE
        path: deploy/build/TunnelCoreVPN_*_windows_x64.exe
        archive: false
        retention-days: 7

  Test-Android-Universal:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      ANDROID_PLATFORM: android-28
      NDK_VERSION: 27.0.11718014
      QT_VERSION: 6.10.1
      QT_DESKTOP_MODULES: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
      QT_ANDROID_MODULES: 'qtremoteobjects qt5compat qtshadertools'
      QT_ANDROID_KEYSTORE_PATH: /tmp/tunnelcore-test.keystore
      QT_ANDROID_KEYSTORE_STORE_PASS: tunnelcore-test
      QT_ANDROID_KEYSTORE_ALIAS: tunnelcore-test
      PROD_AGW_PUBLIC_KEY: ${{ secrets.PROD_AGW_PUBLIC_KEY }}
      PROD_S3_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
      FALLBACK_S3_ENDPOINT: ${{ secrets.FALLBACK_S3_ENDPOINT }}
      DEV_AGW_PUBLIC_KEY: ${{ secrets.DEV_AGW_PUBLIC_KEY }}
      DEV_AGW_ENDPOINT: ${{ secrets.DEV_AGW_ENDPOINT }}
      DEV_S3_ENDPOINT: ${{ secrets.DEV_S3_ENDPOINT }}
      FREE_V2_ENDPOINT: ${{ secrets.FREE_V2_ENDPOINT }}
      PREM_V1_ENDPOINT: ${{ secrets.PREM_V1_ENDPOINT }}

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Verify Google Play package ID'
      shell: bash
      run: |
        grep -Fq 'applicationId = "com.vnextdev.tunnelcorevpn"' client/android/build.gradle.kts
        grep -Fq 'set(CLIENT_ANDROID_PACKAGE "com.vnextdev.tunnelcorevpn"' client/cmake/branding/android.cmake

    - name: 'Install desktop Qt'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: ${{ env.QT_DESKTOP_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Test TunnelCore account controller'
      shell: bash
      run: |
        cmake -S client/tests/tunnelcore -B /tmp/tunnelcore-controller-build -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
        cmake --build /tmp/tunnelcore-controller-build --parallel 2
        ctest --test-dir /tmp/tunnelcore-controller-build --output-on-failure

    - name: 'Install Android Qt armeabi-v7a'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        # Qt 6.7+ Android packages live in the shared all_os repository.
        # Version discovery runs before install-qt can normalize the host.
        host: 'all_os'
        target: 'android'
        arch: 'android_armv7'
        modules: ${{ env.QT_ANDROID_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install Android Qt arm64-v8a'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        # Qt 6.7+ Android packages live in the shared all_os repository.
        # Version discovery runs before install-qt can normalize the host.
        host: 'all_os'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: ${{ env.QT_ANDROID_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install Android Qt x86'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        # Qt 6.7+ Android packages live in the shared all_os repository.
        # Version discovery runs before install-qt can normalize the host.
        host: 'all_os'
        target: 'android'
        arch: 'android_x86'
        modules: ${{ env.QT_ANDROID_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install Android Qt x86_64'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        # Qt 6.7+ Android packages live in the shared all_os repository.
        # Version discovery runs before install-qt can normalize the host.
        host: 'all_os'
        target: 'android'
        arch: 'android_x86_64'
        modules: ${{ env.QT_ANDROID_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup Java'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 'Create test Android keystore'
      shell: bash
      run: |
        keytool -genkeypair -v \
          -keystore "$QT_ANDROID_KEYSTORE_PATH" \
          -storepass "$QT_ANDROID_KEYSTORE_STORE_PASS" \
          -keypass "$QT_ANDROID_KEYSTORE_STORE_PASS" \
          -alias "$QT_ANDROID_KEYSTORE_ALIAS" \
          -keyalg RSA \
          -keysize 2048 \
          -validity 3650 \
          -dname "CN=TunnelCore VPN Test, OU=CI, O=VnextDevelopment, L=CI, ST=CI, C=DE"

    - name: 'Setup Android SDK'
      uses: android-actions/setup-android@v4
      with:
        packages: "platforms;${{ env.ANDROID_PLATFORM }} platforms;android-36 build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}"

    - name: 'Setup Python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install Conan'
      run: pip install "conan==2.28.0"

    # Use a disposable CI certificate, never the Google Play/release signing key.
    # This APK is installable for sideload testing, but an installed copy must
    # be uninstalled before replacing it with one signed by a different key.
    - name: 'Build and sign universal Android APK (CI test key)'
      shell: bash
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
      run: |
        set -euo pipefail
        # Include ARMv7 for older SberBox devices and both x86 architectures.
        deploy/build.sh -t android \
          --abi arm64-v8a --abi armeabi-v7a --abi x86_64 --abi x86 \
          --build ./deploy/build/android-universal --sign

        VERSION=$(grep '^CMAKE_PROJECT_VERSION:STATIC=' deploy/build/android-universal/CMakeCache.txt | cut -d= -f2)
        test -n "$VERSION"
        mapfile -t apks < <(find deploy/build/android-universal/client/android-build/build/outputs/apk \
          -maxdepth 1 -type f -name '*release-signed.apk')
        if [[ "${#apks[@]}" -ne 1 ]]; then
          echo "::error::Expected one signed universal OSS APK, found ${#apks[@]}"
          exit 1
        fi

        unzip -Z1 "${apks[0]}" > /tmp/tunnelcore-apk-entries.txt
        for abi in armeabi-v7a arm64-v8a x86 x86_64; do
          if ! grep -q "^lib/${abi}/" /tmp/tunnelcore-apk-entries.txt; then
            echo "::error::Missing ${abi} native libraries from universal APK"
            exit 1
          fi
        done
        "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "${apks[0]}"
        mkdir -p deploy/artifacts
        cp "${apks[0]}" "deploy/artifacts/TunnelCoreVPN_${VERSION}_android_universal-ci.apk"

    - name: 'Upload universal Android APK'
      uses: actions/upload-artifact@v7
      with:
        name: TunnelCoreVPN-Android-Universal-CI
        path: deploy/artifacts/TunnelCoreVPN_*_android_universal-ci.apk
        archive: false
        retention-days: 7
